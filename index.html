<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeechLess - הפיכת טקסט לדיבור</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">🟠 SpeechLess</div>
            <h1>הופכים טקסט לדיבור בקליק</h1>
            <p>הקלידו טקסט בעברית או באנגלית, בחרו קול והפעילו!</p>
        </header>

        <main>
            <div class="input-section">
                <textarea id="text-input" placeholder="הקלידו או הדביקו כאן את הטקסט שלכם..."></textarea>
                <div class="char-count"><span id="current-chars">0</span> תווים</div>
            </div>

            <div class="controls-section">
                <div class="control-row">
                    <label for="voice-select">🗣️ בחר קול:</label>
                    <select id="voice-select">
                        <option value="">טוען קולות...</option>
                    </select>
                </div>

                <div class="sliders-grid">
                    <div class="slider-box">
                        <div class="slider-label">
                            <span>⚡ מהירות דיבור:</span>
                            <span id="rate-value" class="badge">1x</span>
                        </div>
                        <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
                    </div>

                    <div class="slider-box">
                        <div class="slider-label">
                            <span>🎵 טון קול (Pitch):</span>
                            <span id="pitch-value" class="badge">1</span>
                        </div>
                        <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1">
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="play-btn" class="btn play-btn">▶️ נגן טקסט</button>
                    <button id="pause-btn" class="btn pause-btn" disabled>⏸️ השהה</button>
                    <button id="stop-btn" class="btn stop-btn">🛑 עצור</button>
                    <button id="clear-btn" class="btn clear-btn">🗑️ נקה הכל</button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 SpeechLess App | כל הזכויות שמורות</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
