<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeechLess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>SpeechLess</h1>
            <p>הופכים טקסט לדיבור בקליק אחד</p>
        </header>

        <main>
            <div class="input-area">
                <textarea id="text-input" placeholder="הקלד או הדבק כאן את הטקסט שלך..."></textarea>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="voice-select">בחר קול:</label>
                    <select id="voice-select">
                        </select>
                </div>

                <div class="sliders">
                    <div class="slider-group">
                        <label for="rate">מהירות: <span id="rate-value">1</span></label>
                        <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
                    </div>
                    <div class="slider-group">
                        <label for="pitch">טון (Pitch): <span id="pitch-value">1</span></label>
                        <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1">
                    </div>
                </div>

                <div class="buttons">
                    <button id="play-btn" class="btn primary-btn">🔊 נגן טקסט</button>
                    <button id="stop-btn" class="btn secondary-btn">🛑 עצור</button>
                    <button id="clear-btn" class="btn danger-btn">🗑️ נקה הכל</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SpeechLess. כל הזכויות שמורות.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
